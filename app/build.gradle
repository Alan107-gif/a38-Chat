import java.util.Locale

plugins {
    id "com.android.application"
}

def signingPropertiesFile = file(System.getenv("A38_CHAT_SIGNING_PROPERTIES")
        ?: "${System.getProperty('user.home')}/.config/a38-chat/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingReady = signingPropertiesFile.isFile()
        && ["storeFile", "storePassword", "keyAlias", "keyPassword"].every {
            def value = signingProperties.getProperty(it)
            value != null && !value.trim().isEmpty()
        }
if (signingReady) {
    signingReady = file(signingProperties.getProperty("storeFile")).isFile()
}

android {
    namespace "de.corecosmetic.a38chat"
    compileSdk 35
    testBuildType "beta"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "de.corecosmetic.a38chat"
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName "1.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CHAT_BASE_URL", "\"https://chat.contentclassic.com/chat/\""
        buildConfigField "boolean", "BETA_CHANNEL", "false"
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
        beta {
            initWith release
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta.3"
            matchingFallbacks = ["release"]
            resValue "string", "app_name", "a38-Chat Beta"
            buildConfigField "String", "CHAT_BASE_URL", "\"https://chat.contentclassic.com/chat-beta/\""
            buildConfigField "boolean", "BETA_CHANNEL", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean packagesProtectedBuild = graph.allTasks.any { task ->
        String name = task.name.toLowerCase(Locale.ROOT)
        boolean protectedType = name.contains("release") || name.contains("beta")
        boolean packageTask = name.startsWith("assemble")
                || name.startsWith("bundle")
                || name.startsWith("package")
                || name.startsWith("install")
        protectedType && packageTask
    }
    if (packagesProtectedBuild && !signingReady) {
        throw new GradleException("A38 release signing is required for beta and release packages")
    }
}

dependencies {
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    compileOnly "androidx.annotation:annotation:1.8.1"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
